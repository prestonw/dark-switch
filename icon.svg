<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS-style rounded rect background -->
  <rect width="1024" height="1024" rx="225" ry="225" fill="#1C1C1E"/>

  <!-- Light half (left) clipped -->
  <clipPath id="left-half">
    <rect x="0" y="0" width="512" height="1024"/>
  </clipPath>
  <circle cx="512" cy="512" r="310" fill="#F2F2F7" clip-path="url(#left-half)"/>

  <!-- Dark half (right) clipped -->
  <clipPath id="right-half">
    <rect x="512" y="0" width="512" height="1024"/>
  </clipPath>
  <circle cx="512" cy="512" r="310" fill="#2C2C2E" clip-path="url(#right-half)"/>

  <!-- Subtle inner ring -->
  <circle cx="512" cy="512" r="310" fill="none" stroke="#48484A" stroke-width="5"/>

  <!-- Sun symbol on light side -->
  <circle cx="350" cy="512" r="52" fill="#FF9F0A"/>
  <g stroke="#FF9F0A" stroke-width="22" stroke-linecap="round">
    <line x1="350" y1="418" x2="350" y2="396"/>
    <line x1="350" y1="606" x2="350" y2="628"/>
    <line x1="256" y1="512" x2="234" y2="512"/>
    <line x1="444" y1="512" x2="466" y2="512"/>
    <line x1="283" y1="445" x2="268" y2="430"/>
    <line x1="417" y1="579" x2="432" y2="594"/>
    <line x1="417" y1="445" x2="432" y2="430"/>
    <line x1="283" y1="579" x2="268" y2="594"/>
  </g>

  <!-- Moon symbol on dark side -->
  <path d="M694 438 A100 100 0 1 0 694 586 A68 68 0 1 1 694 438 Z" fill="#EBEBF5" opacity="0.9"/>

  <!-- Dividing line -->
  <line x1="512" y1="202" x2="512" y2="822" stroke="#1C1C1E" stroke-width="12"/>
</svg>
